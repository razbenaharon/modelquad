# Keeps the SHA-pinned GitHub Actions in .github/workflows current. Dependabot
# rewrites both the commit SHA and the "# vX.Y.Z" comment next to it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
