[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modelquad"
dynamic = ["version"]
description = "ModelQuad: a controlled, read-only Codex review inside Claude Code, with a record of what was sent and found, on Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Raz Ben Aharon" }]
# Dependency policy: every dependency whose API this project binds to carries
# a ceiling, and nothing below it is pinned. For a 1.x+ package the ceiling is
# the next MAJOR version: a ceiling stops a rename like mcp 2.0's FastMCP ->
# MCPServer from arriving unannounced, and leaving minors to float is
# deliberate, because that is what makes CI find behaviour drift early. A
# fast-moving 0.x (or minor-breaking) web package is capped at the next
# untested MINOR instead, and its floor is the minor CI tested; raise both in
# one change once the suite passes on the newer release. Transitive packages
# are not constrained here.
#
# ModelQuad is an MCP server, so the MCP SDK and the libraries the server code
# imports directly (pydantic, anyio) are core dependencies.
dependencies = [
  "mcp>=2.0,<3",
  "pydantic>=2.12,<3",
  "anyio>=4.9,<5",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/razbenaharon/modelquad"
Source = "https://github.com/razbenaharon/modelquad"
Issues = "https://github.com/razbenaharon/modelquad/issues"

[project.scripts]
modelquad = "modelquad.cli_entry:main"
modelquad-mcp = "modelquad.mcp.server:main"

[project.optional-dependencies]
# setuptools is listed because tests drive it in-process (egg_info), and the
# PEP 639 licence metadata above needs setuptools 77 or newer.
dev = [
  "pytest>=7.3,<10",
  "pytest-xdist>=3.5,<4",
  "build>=1.0,<2",
  "setuptools>=77",
]
# Kept empty so existing `pip install ".[mcp,...]"` commands keep working: the
# MCP SDK is now a core dependency.
mcp = []
# Kept empty for the same reason: ModelQuad no longer has a local service.
service = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "modelquad.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"modelquad.adapters" = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
tmp_path_retention_count = 3
tmp_path_retention_policy = "failed"
markers = [
    "serial_timing: live process timing tests run after the parallel suite, with xdist disabled",
    "ci_only: slow repository and packaging checks; run in CI, or locally with MODELQUAD_FULL_SUITE=1",
]
